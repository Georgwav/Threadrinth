packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAge: 10080 # 7 days
strictPeerDependencies: false
autoInstallPeers: true
publicHoistPattern:
  - 'prettier-plugin-*'
  - '@prettier/plugin-*'
  - 'eslint'
  - '@eslint/*'
  - 'eslint-plugin-*'
  - '@nuxt/eslint-config'
  - 'typescript-eslint'
  - 'vue-eslint-parser'
  - 'globals'
# Threadrinth: the @vue-email patches are only for the removed website's emails.
patchedDependencies:
  'readable-stream@2.3.8': 'patches/readable-stream@2.3.8.patch'
peerDependencyRules:
  allowedVersions:
    vite: '8'
    esbuild: '0'
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  canvas: false
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
